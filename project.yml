name: Clipboard2
options:
  bundleIdPrefix: at.softmaze
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: XWTH2647FF
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.7.0"
    CURRENT_PROJECT_VERSION: "15"
    DEAD_CODE_STRIPPING: YES

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"

targets:
  Clipboard2:
    type: application
    platform: macOS
    sources:
      - path: Clipboard2
    info:
      path: Clipboard2/Info.plist
      properties:
        CFBundleDisplayName: clipboard2-test
        CFBundleName: clipboard2-test
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Softmaze Solutions GmbH"
        CFBundleURLTypes:
          - CFBundleURLName: at.softmaze.Clippy.test
            CFBundleURLSchemes: [clipboard2test]
        UTExportedTypeDeclarations:
          # Encrypted backups (docs/BACKUP-FORMAT.md).
          - UTTypeIdentifier: at.softmaze.clippy.backup
            UTTypeDescription: Clipboard2 Backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [clipboard2backup]
          # A history item dragged within the quick panel (its id; never leaves the app).
          - UTTypeIdentifier: at.softmaze.clippy.clip-reference
            UTTypeDescription: Clipboard2 Item
            UTTypeConformsTo: [public.data]
        # Sparkle is switched off in this flavour: the released feed would replace this
        # test build with the released app. The feed address is a deliberate dead end.
        SUFeedURL: https://localhost/clipboard2-test-has-no-updates
        SUPublicEDKey: EYXl4+z6FlFfMyGuKf4+WHXcB3c8WHA6ThmEj4pPwwI=
        SUEnableAutomaticChecks: false
        SUScheduledCheckInterval: 3600
        SUAllowsAutomaticUpdates: false
        # Updates download quietly and install on quit (Settings → General → Updates).
        SUAutomaticallyUpdate: false
        SUVerifyUpdateBeforeExtraction: true
        NSServices:
          - NSMenuItem:
              default: clipboard2-test Actions…
            NSMessage: clippyActions
            NSPortName: clipboard2-test
            NSSendTypes: [public.utf8-plain-text, NSStringPboardType]
            NSRequiredContext: {}
          - NSMenuItem:
              default: Paste Text from Clipboard Image (test)
            NSMessage: pasteTextFromImage
            NSPortName: clipboard2-test
            NSReturnTypes: [public.utf8-plain-text, NSStringPboardType]
            NSRequiredContext: {}
    entitlements:
      path: Clipboard2/Clipboard2.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        # A separate app: its own name, bundle id, data folder and keychain entries, so it
        # installs next to the released Clipboard2 without touching it.
        PRODUCT_NAME: clipboard2-test
        # The Swift module keeps its name: code and tests refer to `Clipboard2.`.
        PRODUCT_MODULE_NAME: Clipboard2
        PRODUCT_BUNDLE_IDENTIFIER: at.softmaze.Clippy.test
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: at.softmaze.Clippy.test.debug
        Release:
          # Notarization rejects the debugger entitlement Xcode injects by default.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle

  Clipboard2Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Clipboard2Tests
    dependencies:
      - target: Clipboard2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.softmaze.ClippyTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Clipboard2:
    build:
      targets:
        Clipboard2: all
        Clipboard2Tests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Clipboard2Tests
    archive:
      config: Release
