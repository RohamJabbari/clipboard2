name: Clipboard2
options:
  bundleIdPrefix: at.softmaze
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: XWTH2647FF
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: "4"
    DEAD_CODE_STRIPPING: YES

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"

targets:
  Clipboard2:
    type: application
    platform: macOS
    sources:
      - path: Clipboard2
    info:
      path: Clipboard2/Info.plist
      properties:
        CFBundleDisplayName: Clipboard2
        CFBundleName: Clipboard2
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Softmaze Solutions GmbH"
        CFBundleURLTypes:
          - CFBundleURLName: at.softmaze.Clippy
            CFBundleURLSchemes: [clipboard2, clippy]
        # Sparkle: hourly update checks against the appcast in the GitHub repo.
        SUFeedURL: https://raw.githubusercontent.com/RohamJabbari/clipboard2-macOS/main/appcast.xml
        SUPublicEDKey: EYXl4+z6FlFfMyGuKf4+WHXcB3c8WHA6ThmEj4pPwwI=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 3600
        SUAllowsAutomaticUpdates: true
        SUAutomaticallyUpdate: false
        SUVerifyUpdateBeforeExtraction: true
        NSServices:
          - NSMenuItem:
              default: Clipboard2 Actions…
            NSMessage: clippyActions
            NSPortName: Clipboard2
            NSSendTypes: [public.utf8-plain-text, NSStringPboardType]
            NSRequiredContext: {}
          - NSMenuItem:
              default: Paste Text from Clipboard Image
            NSMessage: pasteTextFromImage
            NSPortName: Clipboard2
            NSReturnTypes: [public.utf8-plain-text, NSStringPboardType]
            NSRequiredContext: {}
    entitlements:
      path: Clipboard2/Clipboard2.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_NAME: Clipboard2
        PRODUCT_BUNDLE_IDENTIFIER: at.softmaze.Clippy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: at.softmaze.Clippy.debug
        Release:
          # Notarization rejects the debugger entitlement Xcode injects by default.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle

  Clipboard2Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Clipboard2Tests
    dependencies:
      - target: Clipboard2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.softmaze.ClippyTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Clipboard2:
    build:
      targets:
        Clipboard2: all
        Clipboard2Tests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Clipboard2Tests
    archive:
      config: Release
