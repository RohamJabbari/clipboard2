name: Clipboard2
options:
  bundleIdPrefix: at.softmaze
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: XWTH2647FF
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.12.0"
    CURRENT_PROJECT_VERSION: "21"
    DEAD_CODE_STRIPPING: YES
    # System AutoFill (docs/features/autofill-setup.md). 1 needs the two Developer ID provisioning
    # profiles: it embeds the extension, adds the AutoFill and Keychain-sharing entitlements and
    # compiles with AUTOFILL. 0 (the default) builds exactly what shipped before.
    CLIPBOARD2_AUTOFILL: "0"
    AUTOFILL_CONDITION_1: AUTOFILL
    AUTOFILL_ENTITLEMENTS_1: "-AutoFill"
    # Provisioning profile UUIDs, passed by scripts/autofill-profiles.sh; empty: none.
    CLIPBOARD2_APP_PROFILE: ""
    CLIPBOARD2_AUTOFILL_PROFILE: ""

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"

targets:
  Clipboard2:
    type: application
    platform: macOS
    sources:
      - path: Clipboard2
        excludes:
          - Resources/PublicSuffixList.dat
      # Trimmed public suffix list for grouping Auth by site (AuthSources.swift).
      - path: Clipboard2/Resources/PublicSuffixList.dat
        buildPhase: resources
    info:
      path: Clipboard2/Info.plist
      properties:
        CFBundleDisplayName: Clipboard2
        CFBundleName: Clipboard2
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Softmaze Solutions GmbH"
        CFBundleURLTypes:
          - CFBundleURLName: at.softmaze.Clippy
            CFBundleURLSchemes: [clipboard2, clippy]
        UTExportedTypeDeclarations:
          # Encrypted backups (docs/BACKUP-FORMAT.md).
          - UTTypeIdentifier: at.softmaze.clippy.backup
            UTTypeDescription: Clipboard2 Backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [clipboard2backup]
          # A history item dragged within the quick panel (its id; never leaves the app).
          - UTTypeIdentifier: at.softmaze.clippy.clip-reference
            UTTypeDescription: Clipboard2 Item
            UTTypeConformsTo: [public.data]
        # Sparkle: hourly update checks against the appcast in the GitHub repo.
        SUFeedURL: https://raw.githubusercontent.com/RohamJabbari/clipboard2-macOS/main/appcast.xml
        SUPublicEDKey: EYXl4+z6FlFfMyGuKf4+WHXcB3c8WHA6ThmEj4pPwwI=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 3600
        SUAllowsAutomaticUpdates: true
        # Updates download quietly and install on quit (Settings → General → Updates).
        SUAutomaticallyUpdate: true
        SUVerifyUpdateBeforeExtraction: true
        NSServices:
          - NSMenuItem:
              default: Clipboard2 Actions…
            NSMessage: clippyActions
            NSPortName: Clipboard2
            NSSendTypes: [public.utf8-plain-text, NSStringPboardType]
            NSRequiredContext: {}
          - NSMenuItem:
              default: Paste Text from Clipboard Image
            NSMessage: pasteTextFromImage
            NSPortName: Clipboard2
            NSReturnTypes: [public.utf8-plain-text, NSStringPboardType]
            NSRequiredContext: {}
    settings:
      base:
        PRODUCT_NAME: Clipboard2
        PRODUCT_BUNDLE_IDENTIFIER: at.softmaze.Clippy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        # Clipboard2.entitlements, or Clipboard2-AutoFill.entitlements with CLIPBOARD2_AUTOFILL=1.
        CODE_SIGN_ENTITLEMENTS: Clipboard2/Clipboard2$(AUTOFILL_ENTITLEMENTS_$(CLIPBOARD2_AUTOFILL)).entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(CLIPBOARD2_APP_PROFILE)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(AUTOFILL_CONDITION_$(CLIPBOARD2_AUTOFILL))
        # The embed script below writes into the app bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: at.softmaze.Clippy.debug
        Release:
          # Notarization rejects the debugger entitlement Xcode injects by default.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
      # Always built (it signs without a profile when CLIPBOARD2_AUTOFILL is 0), embedded only with 1.
      - target: Clipboard2 AutoFill
        embed: false
    postBuildScripts:
      - name: Embed AutoFill Extension
        basedOnDependencyAnalysis: false
        script: |
          DEST="${TARGET_BUILD_DIR}/${PLUGINS_FOLDER_PATH}"
          if [ "${CLIPBOARD2_AUTOFILL}" = "1" ]; then
            mkdir -p "$DEST"
            rm -rf "$DEST/Clipboard2 AutoFill.appex"
            ditto "${BUILT_PRODUCTS_DIR}/Clipboard2 AutoFill.appex" "$DEST/Clipboard2 AutoFill.appex"
          else
            rm -rf "$DEST/Clipboard2 AutoFill.appex"
            rmdir "$DEST" 2>/dev/null || true
          fi

  # System AutoFill (docs/features/auth-autofill.md → Phase 3). Shares the Keychain code with the app.
  Clipboard2 AutoFill:
    type: app-extension
    platform: macOS
    sources:
      - path: Clipboard2AutoFill
      - path: Clipboard2/Shared
      - path: Clipboard2/Services/TOTP.swift
    info:
      path: Clipboard2AutoFill/Info.plist
      properties:
        CFBundleDisplayName: Clipboard2
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Softmaze Solutions GmbH"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionShowsConfigurationUI: false
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              # macOS 15+; older systems ignore it.
              ProvidesOneTimeCodes: true
    settings:
      base:
        PRODUCT_NAME: Clipboard2 AutoFill
        PRODUCT_BUNDLE_IDENTIFIER: at.softmaze.Clippy.autofill
        CODE_SIGN_ENTITLEMENTS: Clipboard2AutoFill/Clipboard2AutoFill$(AUTOFILL_ENTITLEMENTS_$(CLIPBOARD2_AUTOFILL)).entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(CLIPBOARD2_AUTOFILL_PROFILE)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(AUTOFILL_CONDITION_$(CLIPBOARD2_AUTOFILL))
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: at.softmaze.Clippy.debug.autofill
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  Clipboard2Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Clipboard2Tests
    dependencies:
      - target: Clipboard2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.softmaze.ClippyTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Clipboard2:
    build:
      targets:
        Clipboard2: all
        Clipboard2Tests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Clipboard2Tests
    archive:
      config: Release
