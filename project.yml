name: Clipboard2
options:
  bundleIdPrefix: at.softmaze
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: XWTH2647FF
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.12.2"
    CURRENT_PROJECT_VERSION: "23"
    DEAD_CODE_STRIPPING: YES
    # System AutoFill (docs/features/autofill-setup.md). 1 needs the two Developer ID provisioning
    # profiles: it embeds the extension, adds the AutoFill and Keychain-sharing entitlements and
    # compiles with AUTOFILL. 0 (the default) builds exactly what shipped before.
    CLIPBOARD2_AUTOFILL: "0"
    AUTOFILL_CONDITION_1: AUTOFILL
    AUTOFILL_ENTITLEMENTS_1: "-AutoFill"
    # Provisioning profile UUIDs, passed by scripts/autofill-profiles.sh; empty: none.
    CLIPBOARD2_APP_PROFILE: ""
    CLIPBOARD2_AUTOFILL_PROFILE: ""

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"

targets:
  Clipboard2:
    type: application
    platform: macOS
    sources:
      - path: Clipboard2
        excludes:
          - Resources/PublicSuffixList.dat
      # Trimmed public suffix list for grouping Auth by site (AuthSources.swift).
      - path: Clipboard2/Resources/PublicSuffixList.dat
        buildPhase: resources
      # Platform-neutral code shared with the iOS app (docs/features/ios.md).
      - path: Core
    info:
      path: Clipboard2/Info.plist
      properties:
        CFBundleDisplayName: clipboard2-origin
        CFBundleName: clipboard2-origin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Softmaze Solutions GmbH"
        CFBundleURLTypes:
          - CFBundleURLName: at.softmaze.Clippy.test
            CFBundleURLSchemes: [clipboard2test]
        UTExportedTypeDeclarations:
          # Encrypted backups (docs/BACKUP-FORMAT.md).
          - UTTypeIdentifier: at.softmaze.clippy.backup
            UTTypeDescription: Clipboard2 Backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [clipboard2backup]
          # A history item dragged within the quick panel (its id; never leaves the app).
          - UTTypeIdentifier: at.softmaze.clippy.clip-reference
            UTTypeDescription: Clipboard2 Item
            UTTypeConformsTo: [public.data]
        # Sparkle is switched off in this flavour: the released feed would replace this
        # test build with the released app. The feed address is a deliberate dead end.
        SUFeedURL: https://localhost/clipboard2-origin-has-no-updates
        SUPublicEDKey: EYXl4+z6FlFfMyGuKf4+WHXcB3c8WHA6ThmEj4pPwwI=
        SUEnableAutomaticChecks: false
        SUScheduledCheckInterval: 3600
        SUAllowsAutomaticUpdates: false
        # Updates download quietly and install on quit (Settings → General → Updates).
        SUAutomaticallyUpdate: false
        SUVerifyUpdateBeforeExtraction: true
        NSServices:
          - NSMenuItem:
              default: clipboard2-origin Actions…
            NSMessage: clippyActions
            NSPortName: clipboard2-origin
            NSSendTypes: [public.utf8-plain-text, NSStringPboardType]
            NSRequiredContext: {}
          - NSMenuItem:
              default: Paste Text from Clipboard Image (test)
            NSMessage: pasteTextFromImage
            NSPortName: clipboard2-origin
            NSReturnTypes: [public.utf8-plain-text, NSStringPboardType]
            NSRequiredContext: {}
    settings:
      base:
        # A separate app: its own name, bundle id, data folder and keychain entries, so it
        # installs next to the released Clipboard2 without touching it.
        PRODUCT_NAME: clipboard2-origin
        # The Swift module keeps its name: code and tests refer to `Clipboard2.`.
        PRODUCT_MODULE_NAME: Clipboard2
        # Keeps the id from when it was called clipboard2-test: data and sign-in live under it.
        PRODUCT_BUNDLE_IDENTIFIER: at.softmaze.Clippy.test
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        # Clipboard2.entitlements, or Clipboard2-AutoFill.entitlements with CLIPBOARD2_AUTOFILL=1.
        CODE_SIGN_ENTITLEMENTS: Clipboard2/Clipboard2$(AUTOFILL_ENTITLEMENTS_$(CLIPBOARD2_AUTOFILL)).entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(CLIPBOARD2_APP_PROFILE)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(AUTOFILL_CONDITION_$(CLIPBOARD2_AUTOFILL))
        # The embed script below writes into the app bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: at.softmaze.Clippy.test.debug
        Release:
          # Notarization rejects the debugger entitlement Xcode injects by default.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
      # Always built (it signs without a profile when CLIPBOARD2_AUTOFILL is 0), embedded only with 1.
      - target: Clipboard2 AutoFill
        embed: false
    postBuildScripts:
      - name: Embed AutoFill Extension
        basedOnDependencyAnalysis: false
        script: |
          DEST="${TARGET_BUILD_DIR}/${PLUGINS_FOLDER_PATH}"
          if [ "${CLIPBOARD2_AUTOFILL}" = "1" ]; then
            mkdir -p "$DEST"
            rm -rf "$DEST/Clipboard2 AutoFill.appex"
            ditto "${BUILT_PRODUCTS_DIR}/Clipboard2 AutoFill.appex" "$DEST/Clipboard2 AutoFill.appex"
          else
            rm -rf "$DEST/Clipboard2 AutoFill.appex"
            rmdir "$DEST" 2>/dev/null || true
          fi

  # System AutoFill (docs/features/auth-autofill.md → Phase 3). Shares the Keychain code with the app.
  Clipboard2 AutoFill:
    type: app-extension
    platform: macOS
    sources:
      - path: Clipboard2AutoFill
      - path: Clipboard2/Shared
      - path: Core/Auth/TOTP.swift
    info:
      path: Clipboard2AutoFill/Info.plist
      properties:
        CFBundleDisplayName: Clipboard2
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Softmaze Solutions GmbH"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionShowsConfigurationUI: false
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              # macOS 15+; older systems ignore it.
              ProvidesOneTimeCodes: true
    settings:
      base:
        PRODUCT_NAME: Clipboard2 AutoFill
        PRODUCT_BUNDLE_IDENTIFIER: at.softmaze.Clippy.autofill
        CODE_SIGN_ENTITLEMENTS: Clipboard2AutoFill/Clipboard2AutoFill$(AUTOFILL_ENTITLEMENTS_$(CLIPBOARD2_AUTOFILL)).entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(CLIPBOARD2_AUTOFILL_PROFILE)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(AUTOFILL_CONDITION_$(CLIPBOARD2_AUTOFILL))
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: at.softmaze.Clippy.debug.autofill
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  Clipboard2Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Clipboard2Tests
    dependencies:
      - target: Clipboard2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.softmaze.ClippyTests
        GENERATE_INFOPLIST_FILE: YES
        # The host app is named clipboard2-origin in this flavour, not after its target.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/clipboard2-origin.app/Contents/MacOS/clipboard2-origin
        BUNDLE_LOADER: $(TEST_HOST)

  # iOS app (docs/features/ios.md). Shares Core/ with the Mac app. Apple Development, automatic
  # signing: Developer ID can't sign iOS. Simulator builds need no provisioning profile.
  Clipboard2 iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS/App
      - path: iOS/Shared
      - path: iOS/Resources
      - path: Core
      - path: Clipboard2/Resources/PublicSuffixList.dat
        buildPhase: resources
    info:
      path: iOS/App/Info.plist
      properties:
        CFBundleDisplayName: Clipboard2
        CFBundleName: Clipboard2
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSFaceIDUsageDescription: Clipboard2 asks for Face ID before showing or copying a password.
        # Read at run time to name the shared Keychain group (SharedContainer.swift).
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSHumanReadableCopyright: "© 2026 Softmaze Solutions GmbH"
    entitlements:
      path: iOS/App/Clipboard2iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.at.softmaze.Clippy.ios]
        keychain-access-groups: [$(AppIdentifierPrefix)at.softmaze.Clippy.ios.shared]
    settings:
      base:
        PRODUCT_NAME: Clipboard2
        PRODUCT_MODULE_NAME: Clipboard2iOS
        PRODUCT_BUNDLE_IDENTIFIER: at.softmaze.Clippy.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: Clipboard2 Share

  # "Share to Clipboard2": text, links, images and files into Copies or Saved.
  Clipboard2 Share:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS/ShareExtension
      - path: iOS/Shared
      - path: Core
    info:
      path: iOS/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Clipboard2
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSHumanReadableCopyright: "© 2026 Softmaze Solutions GmbH"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 10
    entitlements:
      path: iOS/ShareExtension/Clipboard2Share.entitlements
      properties:
        com.apple.security.application-groups: [group.at.softmaze.Clippy.ios]
        keychain-access-groups: [$(AppIdentifierPrefix)at.softmaze.Clippy.ios.shared]
    settings:
      base:
        PRODUCT_NAME: Clipboard2 Share
        PRODUCT_MODULE_NAME: Clipboard2Share
        PRODUCT_BUNDLE_IDENTIFIER: at.softmaze.Clippy.ios.share
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES

  Clipboard2 iOS Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS/Tests
    dependencies:
      - target: Clipboard2 iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.softmaze.Clippy.iosTests
        GENERATE_INFOPLIST_FILE: YES
        # The app's product is Clipboard2.app, not "Clipboard2 iOS.app".
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Clipboard2.app/Clipboard2
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  Clipboard2:
    build:
      targets:
        Clipboard2: all
        Clipboard2Tests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Clipboard2Tests
    archive:
      config: Release
  Clipboard2 iOS:
    build:
      targets:
        Clipboard2 iOS: all
        Clipboard2 iOS Tests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Clipboard2 iOS Tests
    archive:
      config: Release
