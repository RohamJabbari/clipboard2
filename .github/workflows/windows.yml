name: Windows

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
    tags: ['windows-v*']
  pull_request:
    paths: ['windows/**']
  workflow_dispatch:
    inputs:
      package:
        description: Build the installer as an artifact (nothing is published)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/windows-v* ]]; then
            echo "version=${GITHUB_REF_NAME#windows-v}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ inputs.package }}" == "true" ]]; then
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: dotnet test windows/tests/Clipboard2.Core.Tests -c Release

      - name: Publish
        run: >
          dotnet publish windows/src/Clipboard2.App -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Smoke-check the build
        shell: pwsh
        run: |
          if (-not (Test-Path publish/Clipboard2.exe)) { throw "Clipboard2.exe missing" }
          if (-not (Test-Path publish/e_sqlite3.dll)) { throw "SQLite native library missing" }

      - name: Package (installer + update feed)
        if: startsWith(github.ref, 'refs/tags/windows-v') || inputs.package
        shell: bash
        run: |
          dotnet tool install -g vpk --version 1.2.161
          vpk pack --packId Clipboard2 --packVersion "${{ steps.version.outputs.version }}" \
            --packDir publish --mainExe Clipboard2.exe --outputDir releases \
            --packTitle "Clipboard2" --packAuthors "Softmaze Solutions GmbH" \
            --icon windows/src/Clipboard2.App/Assets/app.ico --delta None
          ls -la releases

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp releases/Clipboard2-win-Setup.exe "releases/Clipboard2-${VERSION}-Setup.exe"
          gh release create "$GITHUB_REF_NAME" "releases/Clipboard2-${VERSION}-Setup.exe" releases/Clipboard2-win-Portable.zip \
            --title "Clipboard2 for Windows ${VERSION}" --latest=false \
            --notes "Download **Clipboard2-${VERSION}-Setup.exe** and run it — it installs in seconds, no admin rights needed. Installed copies update themselves.

          The installer isn't code-signed yet, so Windows may say \"Windows protected your PC\": click **More info → Run anyway**."
          # One fixed release holds the update feed the app checks every hour. Installed apps only accept it
          # with a valid releases.win.json.sig, which CI can't make: `make windows-release` signs it afterwards
          # on the developer's Mac (scripts/sign-windows-feed.sh). Until then the old signature no longer
          # matches, so apps quietly skip this feed.
          gh release view windows-latest >/dev/null 2>&1 || \
            gh release create windows-latest --title "Windows update feed" --latest=false --prerelease \
              --notes "Used by installed copies of Clipboard2 for Windows to update themselves. Download the installer from the newest *Clipboard2 for Windows* release instead."
          gh release delete-asset windows-latest releases.win.json.sig -y 2>/dev/null || true
          gh release upload windows-latest releases/releases.win.json releases/*-full.nupkg --clobber
          [ -f releases/assets.win.json ] && gh release upload windows-latest releases/assets.win.json --clobber || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clipboard2-windows-${{ steps.version.outputs.version }}
          path: |
            publish
            releases
          if-no-files-found: ignore
